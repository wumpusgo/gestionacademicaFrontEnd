<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="bg-white p-8 rounded shadow-md w-96">
    <h2 class="text-2xl font-bold mb-6 text-center">Inicio Sesion estudiantes</h2>
    <form (submit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Usuario</label>
        <input
          type="text"
          [value]="username()"
          (input)="updateUsername($any($event.target).value)"
          class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm focus:ring-blue-500 focus:border-blue-500"
          required
        />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Contraseña</label>
        <input
          type="password"
          [value]="password()"
          (input)="updatePassword($any($event.target).value)"
          class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm focus:ring-blue-500 focus:border-blue-500"
          required
        />
      </div>

      <button
        type="submit"
        [disabled]="isLoading()"
        class="w-full bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-700 disabled:bg-blue-300">
        @if(!isLoading()){

        <span>Inciar sesion</span>
        }@else{

        <span>Loading...</span>
      }
      </button>

    </form>
  </div>
</div>
