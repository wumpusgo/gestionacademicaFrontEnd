<div class="container">

 <section class="p-8 flex-1 bg-slate-50 overflow-auto">
      <h1 class="text-3xl font-bold mb-8 text-slate-800">Asignaturas inscritas</h1>

      <div class="bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden">
        <table class="w-full text-left border-collapse">
          <thead class="bg-gray-50 border-b border-gray-200">
            <tr>
              <th class="px-6 py-3 text-xs font-semibold uppercase text-gray-500">Asignatura</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-200">


@for (item of (items$ | async); track item.id) {
  <!-- <div appMateriaDirectiva [idMateria]="item.idMateria"></div> -->
            <tr class="hover:bg-gray-50">
              <td class="px-6 py-4 text-gray-600"><div appMateriaDirectiva [idMateria]="item.idMateria"></div><br></td>
              <td class="px-6 py-4">
                <a (click)="detail(item)" class="text-blue-600 hover:underline text-sm">Ver compañeros Inscritos</a>
              </td>
            </tr>
} @empty {
  <p>No hay elementos.</p>
}
          </tbody>
        </table>
      </div>
    </section>
</div>

@if (showPopup()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 p-4">
    <div class="bg-white rounded-lg shadow-xl max-w-lg w-full p-6 relative">
      <button (click)="closePopup()" class="absolute top-4 right-4 text-gray-500 hover:text-gray-700">
        ✕
      </button>
    <h2 class="text-2xl font-bold mb-4 text-gray-800">Compañeros Inscritos en <div appMateriaDirectiva [idMateria]="selectedItem()!.idMateria"></div> </h2>
      <p class="text-gray-600 mb-4">





@for (item of (programs$ | async); track item.id) {
      <ul class="space-y-2">
      <li class="flex justify-between items-center p-2 bg-gray-50 rounded hover:bg-gray-100">
  <div appEstudianteDirectiva [idEstudiante]="item.idEstudiante"></div>
      </li>
    </ul>
} @empty {
  <p>No hay elementos.</p>
}

      <div class="mt-6 flex justify-end">
        <button (click)="closePopup()" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
          Cerrar
        </button>
      </div>
    </div>
  </div>
}
